<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pi-agent-cf Demo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    #header {
      padding: 16px;
      border-bottom: 1px solid #30363d;
    }

    #header h1 {
      font-size: 18px;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      padding: 8px 12px;
      border-radius: 8px;
      max-width: 80%;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.5;
    }

    .msg.user {
      background: #1f6feb;
      align-self: flex-end;
    }

    .msg.assistant {
      background: #21262d;
      align-self: flex-start;
    }

    .msg.system {
      background: #1c1e23;
      color: #8b949e;
      align-self: center;
      font-size: 12px;
    }

    .msg.tool {
      background: #0d1d30;
      border-left: 3px solid #1f6feb;
      align-self: flex-start;
      font-size: 13px;
    }

    #input-area {
      display: flex;
      padding: 16px;
      gap: 8px;
      border-top: 1px solid #30363d;
    }

    #input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #30363d;
      border-radius: 8px;
      background: #161b22;
      color: #e6edf3;
      font-size: 14px;
      outline: none;
    }

    #input:focus {
      border-color: #1f6feb;
    }

    button {
      padding: 10px 20px;
      background: #238636;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #2ea043;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    #status {
      padding: 4px 16px;
      font-size: 12px;
      color: #8b949e;
    }
  </style>
</head>

<body>
  <div id="header">
    <h1>🤖 pi-agent-cf Demo</h1>
  </div>
  <div id="status">Disconnected</div>
  <div id="messages"></div>
  <div id="input-area">
    <input id="input" type="text" placeholder="Type a message..." autocomplete="off" />
    <button id="send" onclick="send()">Send</button>
    <button id="abort" onclick="abort()" style="background:#da3633">Abort</button>
  </div>

  <script>
    const API_BASE = location.origin;
    let ws = null;
    let sessionId = null;
    let currentAssistantEl = null;
    let currentText = '';

    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const statusEl = document.getElementById('status');
    const sendBtn = document.getElementById('send');

    inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

    async function connect() {
      // 1. Create session
      statusEl.textContent = 'Creating session...';
      const res = await fetch(`${API_BASE}/sessions`, { method: 'POST' });
      const { sessionId: sid } = await res.json();
      sessionId = sid;

      // 2. Connect WebSocket
      const wsUrl = `${location.protocol === 'https:' ? 'wss:' : 'ws:'}//${location.host}/sessions/${sessionId}/ws`;
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        statusEl.textContent = `Connected — Session: ${sessionId.slice(0, 8)}...`;
        addMsg('system', 'Connected to agent.');
      };

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        handleServerMessage(msg);
      };

      ws.onclose = () => {
        statusEl.textContent = 'Disconnected';
        addMsg('system', 'Disconnected.');
      };

      ws.onerror = () => {
        statusEl.textContent = 'Error';
      };
    }

    function handleServerMessage(msg) {
      if (msg.type === 'event') {
        const evt = msg.event;
        switch (evt.type) {
          case 'message_start':
            currentAssistantEl = addMsg('assistant', '');
            currentText = '';
            sendBtn.disabled = true;
            break;
          case 'message_update':
            if (evt.assistantMessageEvent?.type === 'text_delta' && currentAssistantEl) {
              currentText += evt.assistantMessageEvent.delta;
              currentAssistantEl.textContent = currentText;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
            break;
          case 'message_end':
            currentAssistantEl = null;
            sendBtn.disabled = false;
            break;
          case 'tool_execution_start':
            addMsg('tool', `🔧 ${evt.toolName}(${JSON.stringify(evt.args)})`);
            break;
          case 'tool_execution_end': {
            const text = evt.result?.content?.map(c => c.text || '').join('') || '';
            addMsg('tool', `✅ ${evt.toolName} → ${text}`);
            break;
          }
          case 'agent_end':
            sendBtn.disabled = false;
            break;
        }
      } else if (msg.type === 'error') {
        addMsg('system', `Error: ${msg.message}`);
        sendBtn.disabled = false;
      }
    }

    function send() {
      const text = inputEl.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      addMsg('user', text);
      ws.send(JSON.stringify({ type: 'prompt', text }));
      inputEl.value = '';
    }

    function _abort() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({ type: 'abort' }));
      }
    }

    function addMsg(cls, text) {
      const el = document.createElement('div');
      el.className = `msg ${cls}`;
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    // Auto-connect on load
    connect();
  </script>
</body>

</html>
